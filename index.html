<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مستندات Tailwind CSS به فارسی</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme { --font-sans: "Vazirmatn", ui-sans-serif, system-ui, sans-serif; }
    .code-ltr { direction: ltr; text-align: left; }
    html { scroll-padding-top: 5rem; }
  </style>
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
</head>
<body class="bg-white text-slate-700 antialiased dark:bg-slate-950 dark:text-slate-300">

  <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90">
    <div class="mx-auto flex h-14 max-w-[90rem] items-center gap-3 px-4">
      <button id="menuBtn" class="rounded-lg p-2 lg:hidden" aria-label="منو">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
      </button>
      <a href="#/docs/installation" class="font-bold text-slate-900 dark:text-white">
        <span class="code-ltr inline-block">Tailwind CSS</span>
        <span class="text-sm font-medium text-sky-600 dark:text-sky-400">فارسی</span>
      </a>
      <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs dark:bg-slate-800">v4.3</span>
      <div class="flex-1"></div>
      <button id="searchBtn" class="flex items-center gap-3 rounded-lg px-3 py-1.5 text-sm text-slate-500 ring-1 ring-slate-300 hover:ring-slate-400 dark:ring-slate-700">
        جستجو… <kbd class="code-ltr rounded bg-slate-100 px-1.5 text-xs dark:bg-slate-800">Ctrl K</kbd>
      </button>
      <button id="themeBtn" class="rounded-lg px-3 py-1.5 text-sm ring-1 ring-slate-300 hover:bg-slate-100 dark:ring-slate-700 dark:hover:bg-slate-800"></button>
    </div>
  </header>

  <div class="mx-auto flex max-w-[90rem] px-4">
    <aside id="sidebar" class="hidden lg:sticky lg:top-14 lg:block lg:h-[calc(100vh-3.5rem)] lg:w-72 lg:shrink-0 lg:overflow-auto lg:pe-6 lg:pt-8"></aside>
    <main id="main" class="min-w-0 flex-1 py-10 lg:ps-10"></main>
  </div>

  <div id="searchModal" class="fixed inset-0 z-50 hidden items-start justify-center bg-slate-950/50 p-4 pt-[12vh]">
    <div class="w-full max-w-lg overflow-hidden rounded-xl bg-white shadow-2xl ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-700">
      <input id="searchInput" placeholder="جستجو در مستندات…" autocomplete="off"
        class="w-full border-b border-slate-200 bg-transparent px-4 py-3 outline-none dark:border-slate-700" />
      <ul id="searchList" class="max-h-80 overflow-auto p-2"></ul>
    </div>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/content.js"></script>
  <script src="js/content-start.js"></script>
  <script src="js/content-concepts.js"></script>
  <script src="js/content-layout.js"></script>
  <script src="js/content-layout2.js"></script>
  <script src="js/content-flexgrid.js"></script>
  <script src="js/content-sizing.js"></script>
  <script src="js/content-typography.js"></script>
  <script src="js/content-backgrounds.js"></script>
  <script src="js/content-borders-effects.js"></script>
  <script src="js/content-filters.js"></script>
  <script src="js/content-tables.js"></script>
  <script src="js/content-motion.js"></script>
  <script src="js/content-interactivity.js"></script>
  <script src="js/content-states.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
